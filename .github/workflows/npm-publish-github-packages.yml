name: Deploy to DigitalOcean Ubuntu Server

on:
  push:
    branches: [ main, master ] # Change to your default branch if different

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/AI-Photography/AI-Photography
            git pull origin main

            # backend (port 5001)
            cd backend
            npm install --omit=dev
            cd ..

            # frontend (port 3000)
            npm install
            npm run build

            pm2 restart all
            pm2 status
            echo "Deployment completed successfully!"

